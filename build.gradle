plugins { id 'java' }
repositories {
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}
def runeLiteVersion = 'latest.release'
dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}
group = 'com.osrs.combatcoach'
version = '4.0.1-rc.1'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release.set(11) }
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.osrs.combined.CombinedLauncher'
    jvmArgs '-ea'
    args '--developer-mode'
}
['CoachUiVerification', 'CoachCaptureVerification', 'CoachOverlayVerification', 'CoachV4Verification', 'CoachFileBoundaryVerification'].each { testClass ->
    tasks.register(testClass, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "com.osrs.combatcoach.${testClass}"
        jvmArgs '-Djava.awt.headless=true', '-Dfile.encoding=UTF-8'
        args layout.buildDirectory.dir('premium-ui-checks').get().asFile.absolutePath
    }
}
tasks.register('verifyRelease') {
    dependsOn tasks.named('build')
    dependsOn 'CoachUiVerification', 'CoachCaptureVerification', 'CoachOverlayVerification', 'CoachV4Verification', 'CoachFileBoundaryVerification'
}
